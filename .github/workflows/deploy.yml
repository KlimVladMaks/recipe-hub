name: Deploy to VPS

# Автодеплой на удалённый VPS (ДЗ6) + Ansible.
#
# Запускается только при пуше в main (работа в других ветках сборку на сервере
# не триггерит) и вручную через кнопку "Run workflow" / `gh workflow run`.
#
# Деплой выполняет Ansible: runner подключается к VPS по SSH и применяет
# deploy/ansible/deploy.yml (роль app: git pull -> пересборка -> health-check).
# Настройка самого сервера — deploy/ansible/site.yml (запускается редко,
# обычно через deploy/scripts/setup-server.sh).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Не допускаем двух одновременных деплоев: на VPS всего 2 vCPU / 2 ГБ RAM, и
# параллельные сборки образов конкурируют за ресурсы. Очередной пуш в main
# встанет в очередь, а не отменит уже идущий деплой.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull, rebuild and restart on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key and known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install Ansible
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/ansible-venv/bin/pip" install --quiet 'ansible-core>=2.16,<2.19'
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" collection install \
            -r deploy/ansible/requirements.yml

      - name: Run Ansible deploy playbook on VPS
        run: |
          set -euo pipefail
          export SSH_HOST="${{ secrets.SSH_HOST }}"
          export SSH_USER="${{ secrets.SSH_USER }}"
          export SSH_KEY="$HOME/.ssh/deploy_key"
          cd deploy/ansible
          ansible-playbook deploy.yml

      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          curl -fsS "http://${{ secrets.SSH_HOST }}/api/api-gateway-health"
