# CI: сборка, проверка типов и E2E-тесты на каждый push/PR.
#
# Облако здесь не используется: тесты идут против локального docker-compose,
# поэтому прогон бесплатный и не зависит от того, поднят ли учебный стенд.
# Доставка в облако — отдельный workflow `deploy-cloud.yml` (только вручную).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон: ждать устаревшую сборку
# незачем, а минуты раннера — общий ресурс.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  typecheck:
    name: Typecheck (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: api-gateway
            dir: services/api-gateway
            prisma: false
          - project: user
            dir: services/user
            prisma: true
          - project: recipe
            dir: services/recipe
            prisma: true
          - project: tests
            dir: tests
            prisma: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci

      # Prisma-клиент генерируется в src/generated/prisma (каталог в .gitignore),
      # без него tsc не найдёт типы.
      - name: Generate Prisma client
        if: matrix.prisma
        working-directory: ${{ matrix.dir }}
        run: npx prisma generate

      - name: Typecheck
        working-directory: ${{ matrix.dir }}
        run: npm run typecheck

  e2e:
    name: E2E (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      # В git лежат только .env.example: реальные .env создаются из них.
      # JWT_SECRET обязан совпадать во всех трёх сервисах, иначе шлюз не
      # примет токены, выписанные user-service.
      - name: Prepare .env files
        run: |
          set -euo pipefail
          jwt="$(openssl rand -hex 32)"
          for service in api-gateway user recipe; do
            cp "services/$service/.env.example" "services/$service/.env"
            sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${jwt}|" "services/$service/.env"
          done
          unique="$(grep -h '^JWT_SECRET=' services/*/.env | sort -u | wc -l)"
          echo "уникальных JWT_SECRET: $unique (ожидается 1)"
          test "$unique" -eq 1

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API gateway
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:3000/api/api-gateway-health >/dev/null; then
              echo "API поднялся с попытки $attempt"
              exit 0
            fi
            sleep 5
          done
          echo "API не стал доступен за 5 минут"
          docker compose ps
          exit 1

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Run E2E tests
        working-directory: tests
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Run Postman collection (Newman)
        working-directory: tests
        run: |
          set -euo pipefail
          npm run test:postman -- --env-var baseUrl=http://localhost:3000/api 2>&1 | tee "$RUNNER_TEMP/newman.log"

      - name: Dump container logs
        if: failure()
        run: docker compose logs --no-color --tail=300 | tee "$RUNNER_TEMP/compose.log"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose down -v
