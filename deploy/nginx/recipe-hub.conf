# Nginx-конфиг RecipeHub: обратный прокси к API-шлюзу.
#
# Файл хранится в репозитории (инфраструктура как код) и копируется на сервер
# скриптом deploy/scripts/setup-server.sh в /etc/nginx/sites-available/recipe-hub.
#
# Схема: клиент -> nginx :80 -> api-gateway :3000 (127.0.0.1)
# Порт 3000 и внутренние порты (БД, RabbitMQ) на сервере привязаны к 127.0.0.1,
# поэтому наружу доступен только nginx.

server {
    listen 80;
    listen [::]:80;

    # underscore работает как "любой Host", т.е. и по IP, и по домену.
    # Когда появится домен — замени на его имя, например: server_name recipe-hub.example.com;
    server_name _;

    access_log /var/log/nginx/recipe-hub.access.log;
    error_log  /var/log/nginx/recipe-hub.error.log;

    # Запрет на доступ к внутренним service-to-service маршрутам извне.
    # Внутри docker-сети сервисы общаются напрямую, а не через nginx,
    # поэтому блокировка снаружи безопасна.
    location /api/internal/ {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSocket / upgrade-соединений (на будущее).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Максимальный размер загружаемого тела (фото рецептов и т.п.).
    client_max_body_size 20m;
}

