# Модули blackbox-exporter: «чёрный ящик» проверяет сервисы снаружи, так же
# как это делал бы пользователь.
modules:
  # HTTP-проба: успех — ровно 200. Редиректы не идемпотентны для healthcheck,
  # поэтому не следуем им и считаем ошибкой.
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      follow_redirects: false

  # TCP-проба: для сервисов без HTTP-health (Postgres, RabbitMQ).
  tcp_connect:
    prober: tcp
    timeout: 5s
