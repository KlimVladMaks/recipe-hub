# Конфиг Ansible для RecipeHub.
#
# Ansible ищет ansible.cfg в текущем каталоге, поэтому playbook-и запускаются
# из этого каталога:
#
#   cd deploy/ansible && ansible-playbook site.yml
#
# Оба способа запуска (с ноутбука по SSH и локально на VPS через
# `-i localhost, -c local`) используют этот файл.

[defaults]
inventory = inventory/prod.yml
roles_path = roles
collections_path = ~/.ansible/collections:/usr/share/ansible/collections

# Проверяем ключ хоста: в CI known_hosts готовит `ssh-keyscan` (см. workflow),
# локально хосты попадают в known_hosts при первом `ssh root@<IP>`.
host_key_checking = True

# Не сыпать предупреждениями про интерпретатор Python на целевой машине.
interpreter_python = auto_silent

# .retry-файлы в репозитории не нужны.
retry_files_enabled = False
nocows = True

[ssh_connection]
# Меньше round-trip-ов на слабом VPS.
pipelining = True
