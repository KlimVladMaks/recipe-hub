# Общие переменные для всех хостов и playbook-ов.
#
# Значения можно переопределить через `-e` (например, из обёрток
# deploy/scripts/*.sh): приоритет extra vars выше group_vars.

# --- Приложение -------------------------------------------------------
app_dir: "{{ lookup('env', 'APP_DIR') | default('/opt/recipe-hub', true) }}"
repo_url: "{{ lookup('env', 'REPO_URL') | default('https://github.com/KlimVladMaks/recipe-hub.git', true) }}"
branch: "{{ lookup('env', 'BRANCH') | default('main', true) }}"

# Сервисы, у которых есть .env.example -> .env (см. роль app).
services:
  - api-gateway
  - user
  - recipe

# Прод-стек: базовый compose + оверрайд (127.0.0.1, ротация логов) + мониторинг
# (Grafana / Prometheus / Loki / Promtail / node-exporter / cAdvisor / blackbox).
#
# Мониторинг — часть того же compose-проекта, поэтому поднимается той же ролью
# app и тем же `docker compose up -d --build`; отдельного плейбука не нужно.
# Порты мониторинга публикуются только на 127.0.0.1 (см. deploy/README.md).
compose_flags: "-f docker-compose.yml -f deploy/docker-compose.prod.yml -f deploy/docker-compose.monitoring.yml"

# Каталоги, в которых должен существовать .env: сначала сервисы (секреты
# приложения), затем мониторинг (пароль администратора Grafana).
monitoring_dir: "deploy/monitoring"

# Health-эндпоинт шлюза, который опрашивается после старта стека.
health_url: "http://127.0.0.1:3000/api/api-gateway-health"
health_retries: 60
health_delay: 3

# Grafana поднимается вместе со стеком; её health API проверяется после деплоя,
# чтобы упавший контейнер мониторинга не остался незамеченным.
monitoring_health_url: "http://127.0.0.1:3300/api/health"
monitoring_health_retries: 40

# --- Хост -------------------------------------------------------------
# Сервер (и логи контейнеров/CI) живут в UTC. Если нужен другой пояс,
# поменяй значение и прогони `ansible-playbook site.yml --tags common`.
timezone: Etc/UTC

# Swap страхует сборку образов от OOM на VPS с 2 ГБ RAM.
swap_file: /swapfile
swap_size_mb: 2048

# --- nginx ------------------------------------------------------------
# `_` = любой Host (работает и по IP, и по домену). При появлении домена
# заменить здесь, а сертификат выпустить через certbot (см. deploy/README.md).
nginx_server_name: "_"
nginx_client_max_body_size: "20m"
nginx_gateway_upstream: "127.0.0.1:3000"
