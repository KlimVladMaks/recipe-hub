---
# Роль app — состояние приложения: код в app_dir, .env, запущенный стек.
# Используется и в site.yml (первый деплой), и в deploy.yml (обновление).
- name: Получить код приложения (клонировать или обновить)
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ branch }}"
    update: true
    accept_hostkey: true

# Секретов в git нет: .env генерируется из .env.example. `force: false`
# гарантирует, что существующий .env на сервере не будет перезаписан.
- name: Проверить наличие шаблонов .env.example
  ansible.builtin.stat:
    path: "{{ app_dir }}/services/{{ item }}/.env.example"
  loop: "{{ services }}"
  loop_control:
    label: "{{ item }}"
  register: app_env_examples

- name: Создать services/*/.env из .env.example (если ещё нет)
  ansible.builtin.copy:
    src: "{{ app_dir }}/services/{{ item.item }}/.env.example"
    dest: "{{ app_dir }}/services/{{ item.item }}/.env"
    remote_src: true
    force: false
    mode: "0600"
  loop: "{{ app_env_examples.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

# Пароль администратора Grafana. Та же логика, что и у services/*/.env:
# в git только .env.example, на сервере файл создаётся один раз и дальше
# не перезаписывается — пароль можно сменить руками.
- name: Проверить наличие шаблона .env для мониторинга
  ansible.builtin.stat:
    path: "{{ app_dir }}/{{ monitoring_dir }}/.env.example"
  register: app_monitoring_env_example

- name: Создать deploy/monitoring/.env из .env.example (если ещё нет)
  ansible.builtin.copy:
    src: "{{ app_dir }}/{{ monitoring_dir }}/.env.example"
    dest: "{{ app_dir }}/{{ monitoring_dir }}/.env"
    remote_src: true
    force: false
    mode: "0600"
  when: app_monitoring_env_example.stat.exists

# `docker compose up --build` — единственное место, где нужен shell-out:
# модуль community.docker.docker_compose_v2 тянет лишнюю коллекцию и хуже
# переносит долгую сборку образов на VPS с 2 ГБ RAM.
# Задача всегда показывает `changed`: пересборка образов — это и есть деплой,
# даже если код не изменился. Остальные роли идемпотентны, и на повторном
# прогоне `site.yml` меняется только эта задача.
- name: Собрать и запустить стек
  ansible.builtin.command:
    cmd: docker compose {{ compose_flags }} up -d --build
    chdir: "{{ app_dir }}"
  changed_when: true

# Конфиги мониторинга (prometheus.yml, loki-config.yml, promtail-config.yml,
# дашборд, ...) монтируются в контейнеры как файлы. Docker Compose не считает
# изменение содержимого bind-mount причиной пересоздать контейнер, поэтому
# `up -d` после `git pull` применил бы новые настройки только частично.
# Считаем хеш конфигов и пересоздаём контейнеры мониторинга при его изменении.
- name: Посчитать хеш конфигов мониторинга
  ansible.builtin.shell: |
    set -o pipefail
    find {{ app_dir }}/{{ monitoring_dir }} -type f ! -name '.env' -print0 \
      | sort -z | xargs -0 sha1sum | sha1sum | cut -d' ' -f1
  args:
    executable: /bin/bash
  register: app_monitoring_hash
  changed_when: false
  check_mode: false

- name: Прочитать хеш конфигов с прошлого деплоя
  ansible.builtin.slurp:
    src: "{{ monitoring_state_file }}"
  register: app_monitoring_hash_previous
  failed_when: false
  check_mode: false

- name: Создать каталог для файла состояния
  ansible.builtin.file:
    path: "{{ monitoring_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: >-
    app_monitoring_hash_previous.content is not defined
    or (app_monitoring_hash_previous.content | b64decode | trim) != app_monitoring_hash.stdout

- name: Пересоздать контейнеры мониторинга при изменении конфигов
  ansible.builtin.command:
    cmd: >-
      docker compose {{ compose_flags }} up -d --force-recreate
      {{ monitoring_services | join(' ') }}
    chdir: "{{ app_dir }}"
  when: >-
    app_monitoring_hash_previous.content is not defined
    or (app_monitoring_hash_previous.content | b64decode | trim) != app_monitoring_hash.stdout
  changed_when: true

- name: Запомнить хеш конфигов мониторинга
  ansible.builtin.copy:
    content: "{{ app_monitoring_hash.stdout }}\n"
    dest: "{{ monitoring_state_file }}"
    owner: root
    group: root
    mode: "0644"
  when: >-
    app_monitoring_hash_previous.content is not defined
    or (app_monitoring_hash_previous.content | b64decode | trim) != app_monitoring_hash.stdout

- name: Дождаться готовности API
  ansible.builtin.uri:
    url: "{{ health_url }}"
    status_code: 200
  register: app_health
  until: app_health.status | default(0) == 200
  retries: "{{ health_retries }}"
  delay: "{{ health_delay }}"
  changed_when: false

- name: Показать результат
  ansible.builtin.debug:
    msg: >-
      RecipeHub готов: {{ health_url }}
      (внешний адрес — http://<IP_СЕРВЕРА>/api/api-gateway-health,
      логи — cd {{ app_dir }} && docker compose {{ compose_flags }} logs -f)
  when: not ansible_check_mode

# Мониторинг поднимается тем же `up -d`, что и приложение, поэтому проверяем,
# что Grafana действительно отвечает. Без этого «зелёный» деплой мог бы скрыть
# упавший контейнер (например, OOM на VPS с 2 ГБ).
- name: Дождаться готовности Grafana
  ansible.builtin.uri:
    url: "{{ monitoring_health_url }}"
    status_code: 200
  register: app_monitoring_health
  until: app_monitoring_health.status | default(0) == 200
  retries: "{{ monitoring_health_retries }}"
  delay: "{{ health_delay }}"
  changed_when: false

- name: Показать адрес Grafana
  ansible.builtin.debug:
    msg: >-
      Мониторинг готов: ssh -L 3300:127.0.0.1:3300 root@<IP_СЕРВЕРА>,
      затем http://localhost:3300 (дашборд «RecipeHub — мониторинг»)
  when: not ansible_check_mode
