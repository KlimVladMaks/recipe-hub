apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: recipehub
  labels:
    app: user-service
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: recipehub
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
        - name: wait-for-db
          image: __REGISTRY__/recipehub-busybox:__TAG__
          command:
            - sh
            - -c
            - until nc -z user-db 5432; do echo "waiting for user-db"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      containers:
        - name: user-service
          image: __REGISTRY__/recipehub-user:__TAG__
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: USER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recipehub-secrets
                  key: USER_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://user:$(USER_DB_PASSWORD)@user-db:5432/user_db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: recipehub-secrets
                  key: JWT_SECRET
            - name: X_USER_ID
              value: x-user-id
            - name: X_USER_ROLE
              value: x-user-role
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recipehub-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: "amqp://recipehub:$(RABBITMQ_PASSWORD)@rabbitmq:5672"
            - name: ADMIN_USERNAME
              value: admin
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recipehub-secrets
                  key: ADMIN_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /api/user-service-health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/user-service-health
              port: 3001
            initialDelaySeconds: 60
            periodSeconds: 20
