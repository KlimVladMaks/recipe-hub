<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RecipeHub API — справочник</title>
    <meta name="description" content="OpenAPI-справочник RecipeHub: те же эндпоинты и схемы, что в docs/openapi.yaml и Swagger UI.">
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 1rem;
            height: 3.5rem;
            padding: 0 1.25rem;
            background: #bf360c;
            color: #fff;
        }

        .topbar a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
        }

        .topbar a:hover {
            text-decoration: underline;
        }

        .topbar .hint {
            overflow: hidden;
            font-size: 0.9rem;
            opacity: 0.85;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .topbar .back {
            margin-left: auto;
        }

        @media (max-width: 640px) {
            .topbar .hint {
                display: none;
            }
        }
    </style>
</head>
<body>
<header class="topbar">
    <a href="./">← Документация RecipeHub</a>
    <span class="hint">OpenAPI 3.0 · тот же файл docs/openapi.yaml, что и в Swagger UI</span>
    <a class="back" href="./api/">Описание API</a>
</header>

<redoc spec-url="./openapi.yaml"></redoc>

<noscript>
    <p style="padding: 1rem 1.25rem;">
        Для отрисовки справочника нужен JavaScript. Спецификацию можно открыть
        напрямую: <a href="./openapi.yaml">openapi.yaml</a>.
    </p>
</noscript>

<script src="https://cdn.jsdelivr.net/npm/redoc@2/bundles/redoc.standalone.js"></script>
</body>
</html>
