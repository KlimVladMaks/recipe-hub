services:
  user-db:
    image: postgres:18.3-alpine
    container_name: user-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_db
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # recipe-db:
  #   image: postgres:18.3-alpine
  #   container_name: recipe-db
  #   environment:
  #     POSTGRES_USER: user
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: recipe_db
  #     PGDATA: /var/lib/postgresql/data
  #   ports:
  #     - "5434:5432"
  #   volumes:
  #     - recipe_db_data:/var/lib/postgresql/data

  user-service:
    build: ./services/user
    env_file:
      - ./services/user/.env
    depends_on:
      user-db:
        condition: service_healthy
    restart: on-failure
  
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    env_file:
      - ./services/api-gateway/.env
    depends_on:
      user-service:
        condition: service_started
    restart: on-failure

volumes:
  user_db_data:
  # recipe_db_data:
