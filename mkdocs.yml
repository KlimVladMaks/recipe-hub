# Документация RecipeHub: MkDocs + Material.
#
# Локальная сборка:
#   python3 -m venv .venv-docs && .venv-docs/bin/pip install -r requirements-docs.txt
#   .venv-docs/bin/mkdocs serve
#
# Проверка как в CI:
#   .venv-docs/bin/mkdocs build --strict
#
# Публикация: .github/workflows/docs.yml → GitHub Pages.

site_name: RecipeHub
site_description: Документация микросервисного сервиса для обмена рецептами
site_url: https://klimvladmaks.github.io/recipe-hub/
repo_url: https://github.com/KlimVladMaks/recipe-hub
repo_name: KlimVladMaks/recipe-hub
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Главная: index.md
  - Архитектура: architecture.md
  - Быстрый старт: getting-started.md
  - API: api.md
  - Postman: postman.md
  - Тестирование: testing.md
  - Развёртывание: deployment.md
  - Технический дизайн: cloud/technical-design.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: ru

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KlimVladMaks/recipe-hub

copyright: Учебный проект ИТМО, дисциплина «Бэкенд-разработка»
